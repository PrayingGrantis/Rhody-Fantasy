name: Rhody 8AM Daily Sleeper Sync & Hydrogen Roast Engine

on:
  schedule:
    # Runs once a day at 13:00 UTC (8:00 AM EST)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-roast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rhody Website Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create Data Directory
        run: mkdir -p data

      - name: Pull Sleeper League & Generate Gemini 4 Hydrogen Daily Edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-rhody.mjs

      - name: Commit & Auto-Publish Updated Website Data
        run: |
          git config user.name "Rhody Roast Bot"
          git config user.email "bot@rhodyfantasy.local"
          git add data/rhody-data.json
          if ! git diff --staged --quiet; then
            git commit -m "🐏 8AM Daily Edition: Latest Sleeper matchups, trades & Hydrogen roasts"
            git pull --rebase origin main
            git push origin main
          fi
